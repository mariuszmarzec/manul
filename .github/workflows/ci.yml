name: Manul CI

# Keep manual dispatch for full-suite operator runs, and validate every pull request
# because branch/workspace lifecycle changes must not merge without runtime tests.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 util-linux shellcheck gh python3 zsh
      - name: Validate shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find skills/manul-github-bot -maxdepth 1 -type f -name '*.sh' -print | sort)
      - name: Test Team workflow coordinator and policy
        run: |
          python3 skills/manul-github-bot/test_team_coordinator.py
          python3 skills/manul-github-bot/test_workflow_state.py
          python3 skills/manul-github-bot/test_team_policy.py
      - name: Test standalone Todo MCP client
        run: python3 skills/manul-github-bot/test_todo_mcp_client.py
      - name: Test Manul monitor registry and runtime
        run: python3 skills/manul-github-bot/test_manul_monitor.py
      - name: Test read-only operator context snapshot
        run: python3 skills/manul-github-bot/test_manul_operator_context.py
      - name: Test Sphinx Slack intake security contract
        run: python3 skills/manul-github-bot/test_slack_intake_contract.py
      - name: Run SDD Policy Gate regression tests
        run: |
          set -euo pipefail
          bash skills/manul-github-bot/test_sdd_workflow.sh </dev/null
          bash skills/manul-github-bot/test_opencode_agent_discovery.sh </dev/null
      - name: Run hermetic Manul shell tests
        run: |
          set -euo pipefail
          tests="$(find skills/manul-github-bot -maxdepth 1 -type f -name 'test_*.sh' -print | sort)"
          while IFS= read -r test; do
            case "$(basename "$test")" in
              test_agent_modes.sh|test_manul_pr_workflow.sh|test_concurrency_impl.sh)
                echo "SKIP $test (host integration or operator-state test)"
                continue
                ;;
            esac
            echo "::group::$(basename "$test")"
            bash "$test" </dev/null
            echo "::endgroup::"
          done <<<"$tests"

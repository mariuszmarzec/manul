name: Manul CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 util-linux shellcheck gh python3
      - name: Validate shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find skills/manul-github-bot -maxdepth 1 -type f -name '*.sh' -print | sort)
      - name: Run hermetic Manul shell tests
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            case "$(basename "$test")" in
              test_agent_modes.sh|test_manul_pr_workflow.sh|test_concurrency_impl.sh)
                echo "SKIP $test (host integration or operator-state test)"
                continue
                ;;
            esac
            echo "::group::$(basename "$test")"
            bash "$test"
            echo "::endgroup::"
          done < <(find skills/manul-github-bot -maxdepth 1 -type f -name 'test_*.sh' -print | sort)

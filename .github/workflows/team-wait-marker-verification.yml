name: Team wait marker verification

on:
  push:
    branches:
      - fix/opencode-team-wait-marker-81

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3
      - name: OpenCode adapter regressions
        run: bash skills/manul-github-bot/test_adapters.sh
      - name: Team coordinator regressions
        run: python3 skills/manul-github-bot/test_team_coordinator.py
      - name: Workflow checkpoint regressions
        run: python3 skills/manul-github-bot/test_workflow_state.py
      - name: Daemon wrapper integration
        run: bash skills/manul-github-bot/test_daemon_wrapper_integration.sh
      - name: Python syntax
        run: python3 -m py_compile skills/manul-github-bot/team-coordinator.py skills/manul-github-bot/workflow-state.py skills/manul-github-bot/test_team_coordinator.py skills/manul-github-bot/test_workflow_state.py
      - name: Bash syntax
        run: |
          bash -n skills/manul-github-bot/opencode-adapter.sh
          bash -n skills/manul-github-bot/manul-daemon.sh
          bash -n skills/manul-github-bot/agent-executor.sh
          bash -n skills/manul-github-bot/agent-execution-controller.sh
          bash -n skills/manul-github-bot/test_adapters.sh
